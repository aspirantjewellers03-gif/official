<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASPIRANT · necklace collection</title>
  <!-- Google Fonts (same as index) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #fafafa;
      color: #1e1e1e;
      line-height: 1.5;
    }

    /* ----- STICKY HEADER (exact copy from index) ----- */
    .site-header {
      position: sticky;
      top: 0;
      width: 100%;
      background-color: #0a0a0a;
      color: #ffffff;
      padding: 1rem 2rem;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .main-nav ul {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .main-nav a {
      text-decoration: none;
      color: #f0f0f0;
      font-weight: 500;
      font-size: 1rem;
      transition: color 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .main-nav a:hover {
      color: #bbbbbb;
    }

    /* ----- MARQUEE BAR (exact copy from index) ----- */
    .marquee-bar {
      background-color: #2e2e2e;
      color: #ffffff;
      padding: 0.7rem 0;
      border-bottom: 1px solid #444;
    }

    .marquee-content {
      font-size: 1rem;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .separator {
      color: #aaaaaa;
      font-size: 1.4rem;
      line-height: 1;
    }

    .back-button-container {
  max-width: 1400px;
  margin: 1.5rem auto 0;
  padding: 0 2rem;
}

.back-btn {
  background: transparent;
  border: 1.5px solid #1e1e1e;
  color: #1e1e1e;
  padding: 0.6rem 2rem;
  border-radius: 40px;
  font-weight: 500;
  font-size: 1rem;
  cursor: pointer;
  transition: background-color 0.2s, color 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.back-btn:hover {
  background-color: #1e1e1e;
  color: #ffffff;
}

    /* ----- CATEGORY TITLE ----- */
    .category-title {
      max-width: 1400px;
      margin: 2rem auto 1rem;
      padding: 0 2rem;
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1e1e1e;
    }

    /* ----- PRODUCT GRID ----- */
    .product-grid {
      max-width: 1400px;
      margin: 2rem auto 4rem;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem;
    }

    /* ----- PRODUCT CARD ----- */
    .product-card {
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid #eaeaea;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
    }

    /* image container */
    .image-container {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background-color: #f4f4f4;
      cursor: pointer;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .image-container:hover img {
      transform: scale(1.03);
    }

    /* wishlist heart */
    .wishlist-heart {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 1.8rem;
      line-height: 1;
      color: #ccc;
      cursor: pointer;
      transition: color 0.2s;
      z-index: 5;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }

    .wishlist-heart.active {
      color: #b3002d; /* deep ash‑red, still within premium palette */
    }

    /* product info */
    .product-info {
      padding: 1rem 1rem 0.5rem;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
      color: #1e1e1e;
    }

    .product-id {
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 0.3rem;
      letter-spacing: 0.5px;
    }

    .product-price {
      font-size: 1.3rem;
      font-weight: 500;
      color: #0a0a0a;
    }

    /* read more */
    .read-more-container {
      padding: 0 1rem;
    }

    .read-more-btn {
      background: none;
      border: none;
      color: #2e2e2e;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: underline dotted;
      cursor: pointer;
      margin: 0.2rem 0;
      padding: 0;
    }

    .hidden-details {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      font-size: 0.9rem;
      color: #4a4a4a;
      margin-top: 0.2rem;
      border-top: 1px solid transparent;
    }

    .hidden-details.show {
      max-height: 200px;   /* enough for details */
      opacity: 1;
      border-top: 1px solid #ddd;
      padding-top: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .detail-item {
      margin-bottom: 0.3rem;
    }

    .detail-label {
      font-weight: 600;
      color: #2e2e2e;
      display: inline-block;
      min-width: 70px;
    }

    /* hint text */
    .click-hint {
      padding: 0.5rem 1rem 0;
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
    }

    /* buy button */
    .buy-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background-color: #1e1e1e;
      color: #ffffff;
      padding: 0.8rem 1rem;
      margin: 1rem 1rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: background-color 0.2s, transform 0.1s;
      border: 1px solid #1e1e1e;
    }

    .buy-btn:hover {
      background-color: #0a0a0a;
      transform: scale(1.02);
    }

    /* ----- MODAL (fullscreen) ----- */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }

    .modal-image {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 3rem;
      color: white;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
    }

    .modal-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      background: rgba(255,255,255,0.1);
      padding: 0 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .modal-arrow:hover {
      background: rgba(255,255,255,0.3);
    }

    .modal-arrow.left {
      left: 20px;
    }

    .modal-arrow.right {
      right: 20px;
    }

    .image-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 0.3rem 1rem;
      border-radius: 30px;
      font-size: 0.9rem;
    }

    /* ----- RESPONSIVE GRID ----- */
    @media (max-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 640px) {
      .header-container {
        flex-direction: column;
        gap: 0.75rem;
      }
      .main-nav ul {
        gap: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .logo {
        font-size: 1.6rem;
      }
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        padding: 0 1rem;
      }
      .category-title {
        padding: 0 1rem;
        font-size: 1.6rem;
      }
      .modal-arrow {
        font-size: 2rem;
      }
      .modal-close {
        font-size: 2.5rem;
        top: 15px;
        right: 20px;
      }
    }

    @media (max-width: 480px) {
      .product-grid {
        gap: 0.8rem;
      }
      .product-name {
        font-size: 1rem;
      }
      .product-price {
        font-size: 1.1rem;
      }
      .buy-btn {
        padding: 0.6rem 0.5rem;
      }
    }
  </style>
</head>
<body data-category="Necklace">


  <!-- HEADER (exact copy from index) -->
  <header class="site-header">
    <div class="header-container">
      <div class="logo">ASPIRANT</div>
      <nav class="main-nav">
        <ul>
          <li><a href="about-us.html">About Us</a></li>
          <li><a href="wish.html">Wishlist</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MARQUEE DISCOUNT BAR (exact copy from index) -->
  <div class="marquee-bar">
    <marquee behavior="scroll" direction="left" scrollamount="6" class="marquee-content">
      <span>🔥 Flat 20 % OFF Above 599 Shopping</span>
      <span class="separator">•</span>
      <span>🚚 Free Shipping In Siliguri</span>
      <span class="separator">•</span>
      <span>💎 Premium Collection Now Live</span>
    </marquee>
  </div>
<!--back button-->
  <div class="back-button-container">
  <button class="back-btn" onclick="history.back()">← Back</button>
</div>
  <!-- PAGE HEADING -->
  <h1 class="category-title">Nacklace · 4 designs</h1>

  <!-- PRODUCT GRID (20 products) -->
  <div class="product-grid" id="productGrid"></div>

  <!-- IMAGE MODAL (hidden by default) -->
  <div class="modal" id="imageModal">
    <span class="modal-close" id="closeModal">&times;</span>
    <span class="modal-arrow left" id="prevArrow">&#10094;</span>
    <span class="modal-arrow right" id="nextArrow">&#10095;</span>
    <div class="modal-content">
      <img src="" alt="preview" class="modal-image" id="modalImage">
    </div>
    <div class="image-counter" id="imageCounter"></div>
  </div>

  <!-- UPGRADED JAVASCRIPT with localStorage wishlist -->
  <script>
    (function() {
      // -------------------- PRODUCT DATA (20 rings, each with 3 images) --------------------
      const products = [
        { name: 'SOHI Female Silver Plated Necklace', id: 'ASP-NK-001', price: '₹300', size: 'FREE SIZE', material: 'Plating', care: 'Avoid water, store separately', images: ['ES001.png', 'ES001(1).png', 'ES001(2).png'] },
        { name: 'Zeneme White Stone Oxidized Necklace', id: 'ASP-NK-002', price: '₹250', size: 'FREE SIZE', material: 'Oxidized', care: 'Professional cleaning recommended', images: ['ES002.png', 'ES002(1).png', 'ES002(2).png'] },
        { name: 'Oxidized Silver Plated Necklace', id: 'ASP-NK-003', price: '₹300', size: 'FREE SIZE', material: 'Oxidized Silver tone metal', care: 'Avoid Water', images: ['ES003.png', 'ES003(1).png', 'ES003(2).png'] },
        { name: 'Afghan Style Silver Cgoker Necklace', id: 'ASP-NK-004', price: '₹300', size: 'FREE SIZE', material: 'Silver-tone metal', care: 'Avoid chemicals', images: ['ES004.png', 'ES004(1).png', 'ES004(2).png'] },
        
      ];

      // ---------- WISHLIST LOCALSTORAGE HELPERS ----------
      const WISHLIST_KEY = 'aspirantWishlist_necklace';

      function getWishlist() {
        try {
          return JSON.parse(localStorage.getItem(WISHLIST_KEY)) || [];
        } catch {
          return [];
        }
      }

      function saveWishlist(wishlist) {
        localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
      }

      // ---------- RENDER PRODUCT CARDS ----------
      const grid = document.getElementById('productGrid');
      products.forEach((prod, index) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.setAttribute('data-product-index', index);

        // Image container
        const imgContainer = document.createElement('div');
        imgContainer.className = 'image-container';
        const mainImg = document.createElement('img');
        mainImg.src = prod.images[0];
        mainImg.alt = prod.name;
        mainImg.classList.add('product-main-image');
        mainImg.setAttribute('data-product-index', index);
        imgContainer.appendChild(mainImg);

        // Wishlist heart
        const heart = document.createElement('span');
        heart.className = 'wishlist-heart';
        heart.innerHTML = '♡';
        // We'll attach the click event after card is fully built (or use event delegation)
        imgContainer.appendChild(heart);

        card.appendChild(imgContainer);

        // Product info
        const infoDiv = document.createElement('div');
        infoDiv.className = 'product-info';
        infoDiv.innerHTML = `
          <h3 class="product-name">${prod.name}</h3>
          <div class="product-id">ID: ${prod.id}</div>
          <div class="product-price">${prod.price}</div>
        `;
        card.appendChild(infoDiv);

        // Read more section
        const readMoreDiv = document.createElement('div');
        readMoreDiv.className = 'read-more-container';
        const readMoreBtn = document.createElement('button');
        readMoreBtn.className = 'read-more-btn';
        readMoreBtn.textContent = '(...Read More)';
        const hiddenDetails = document.createElement('div');
        hiddenDetails.className = 'hidden-details';
        hiddenDetails.innerHTML = `
          <div class="detail-item"><span class="detail-label">Size:</span> ${prod.size}</div>
          <div class="detail-item"><span class="detail-label">Material:</span> ${prod.material}</div>
          <div class="detail-item"><span class="detail-label">Care:</span> ${prod.care}</div>
        `;
        readMoreDiv.appendChild(readMoreBtn);
        readMoreDiv.appendChild(hiddenDetails);
        card.appendChild(readMoreDiv);

        // Click hint
        const hint = document.createElement('p');
        hint.className = 'click-hint';
        hint.textContent = 'Click the product image for better review.';
        card.appendChild(hint);

        // Buy button
        const buyLink = document.createElement('a');
        buyLink.href = 'checkout.html';
        buyLink.className = 'buy-btn';
        buyLink.textContent = 'Buy Now';
        card.appendChild(buyLink);

        grid.appendChild(card);

        // Read more toggle
        readMoreBtn.addEventListener('click', function() {
          hiddenDetails.classList.toggle('show');
          this.textContent = hiddenDetails.classList.contains('show') ? '(Read Less)' : '(...Read More)';
        });

        // ---------- WISHLIST CLICK HANDLER (per heart) ----------
        heart.addEventListener('click', function(e) {
          e.stopPropagation();
          const cardEl = this.closest('.product-card');
          const prodIdx = parseInt(cardEl.getAttribute('data-product-index'));
          const product = products[prodIdx];
          let wishlist = getWishlist();
          const existingIndex = wishlist.findIndex(item => item.id === product.id);

          if (existingIndex === -1) {
            // Add to wishlist
            wishlist.push({
              id: product.id,
              name: product.name,
              price: product.price,
              image: product.images[0] // store first image for wishlist page
            });
            this.classList.add('active');
            this.innerHTML = '♥';
          } else {
            // Remove from wishlist
            wishlist.splice(existingIndex, 1);
            this.classList.remove('active');
            this.innerHTML = '♡';
          }
          saveWishlist(wishlist);
        });
      });

      // ---------- SYNC HEARTS WITH STORED WISHLIST (on page load) ----------
      function syncWishlistHearts() {
        const wishlist = getWishlist();
        document.querySelectorAll('.product-card').forEach(card => {
          const prodIdx = card.getAttribute('data-product-index');
          if (!prodIdx) return;
          const product = products[parseInt(prodIdx)];
          const heart = card.querySelector('.wishlist-heart');
          if (heart && wishlist.some(item => item.id === product.id)) {
            heart.classList.add('active');
            heart.innerHTML = '♥';
          } else {
            heart.classList.remove('active');
            heart.innerHTML = '♡';
          }
        });
      }
      syncWishlistHearts();

      // -------------------- MODAL FUNCTIONALITY (unchanged) --------------------
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImage');
      const closeModal = document.getElementById('closeModal');
      const prevArrow = document.getElementById('prevArrow');
      const nextArrow = document.getElementById('nextArrow');
      const counter = document.getElementById('imageCounter');

      let currentProductIndex = 0;
      let currentImageIndex = 0;

      document.querySelectorAll('.product-main-image').forEach(img => {
        img.addEventListener('click', function(e) {
          e.stopPropagation();
          const prodIdx = parseInt(this.getAttribute('data-product-index'));
          currentProductIndex = prodIdx;
          currentImageIndex = 0;
          updateModalImage();
          modal.classList.add('active');
        });
      });

      function updateModalImage() {
        const product = products[currentProductIndex];
        modalImg.src = product.images[currentImageIndex];
        counter.textContent = `${currentImageIndex + 1} / ${product.images.length}`;
      }

      prevArrow.addEventListener('click', function() {
        const product = products[currentProductIndex];
        currentImageIndex = (currentImageIndex - 1 + product.images.length) % product.images.length;
        updateModalImage();
      });

      nextArrow.addEventListener('click', function() {
        const product = products[currentProductIndex];
        currentImageIndex = (currentImageIndex + 1) % product.images.length;
        updateModalImage();
      });

      closeModal.addEventListener('click', function() {
        modal.classList.remove('active');
      });

      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          modal.classList.remove('active');
        }
      });

      document.addEventListener('keydown', function(e) {
        if (!modal.classList.contains('active')) return;
        if (e.key === 'Escape') {
          modal.classList.remove('active');
        } else if (e.key === 'ArrowLeft') {
          prevArrow.click();
        } else if (e.key === 'ArrowRight') {
          nextArrow.click();
        }
      });
    })();
  </script>
  <!-- EXTERNAL JAVASCRIPT (only for index.html) -->
  <script src="script.js"></script>
</body>
</html>
