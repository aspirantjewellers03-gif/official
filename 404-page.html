<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Page Not Available · ASPIRANT</title>
  <!-- Google Font: Montserrat (premium, clean) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ----- RESET & FULL PAGE CENTERING ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
      color: #1e1e1e;
    }

    /* main wrapper to keep back button and content together */
    .page-wrapper {
      max-width: 800px;
      width: 100%;
    }

    /* ----- BACK BUTTON (identical to checkout) ----- */
    .back-button-container {
      width: 100%;
      margin-bottom: 1.5rem;           /* space before 404 content */
    }

    .back-btn {
      background: transparent;
      border: 1.5px solid #1e1e1e;
      color: #1e1e1e;
      padding: 0.6rem 2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Montserrat', sans-serif;
    }

    .back-btn:hover {
      background-color: #1e1e1e;
      color: #ffffff;
    }

    /* arrow symbol */
    .back-btn::before {
      content: "←";
      font-size: 1.2rem;
      line-height: 1;
    }

    /* main content container */
    .error-container {
      text-align: center;
    }

    /* big 404 heading */
    .error-title {
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      color: #1a1a1a;
    }

    /* secondary message */
    .error-sub {
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 400;
      color: #4a4a4a;
      margin-bottom: 1.8rem;
    }

    /* "You can shop in:" text */
    .shop-prompt {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #2e2e2e;
    }

    /* category buttons container */
    .category-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    /* base button style */
    .btn {
      display: inline-block;
      background-color: #1e1e1e;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      transition: all 0.25s ease;
      border: 1px solid #1e1e1e;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .btn:hover {
      background-color: #333333;
      border-color: #333333;
      transform: scale(1.05);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    .category-btn {
      min-width: 140px;
    }

    /* Help Us button — slightly bigger to stand out */
    .help-btn {
      font-size: 1.2rem;
      padding: 1rem 3rem;
      background-color: #1e1e1e;
      border: 1px solid #1e1e1e;
    }

    .help-btn:hover {
      background-color: #333333;
      border-color: #333333;
    }

    /* optional small note */
    .note {
      margin-top: 2.5rem;
      font-size: 0.9rem;
      color: #999;
    }

    /* responsive adjustments */
    @media (max-width: 480px) {
      .category-links {
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
      }

      .btn {
        width: 100%;
        max-width: 280px;
        text-align: center;
      }

      .back-btn {
        padding: 0.5rem 1.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <!-- BACK BUTTON (goes to previous page) -->
    <div class="back-button-container">
      <button class="back-btn" onclick="history.back()">Back</button>
    </div>

    <!-- 404 CONTENT -->
    <div class="error-container">
      <h1 class="error-title">404 – Page Not Available</h1>
      <p class="error-sub">The page you are looking for does not exist.</p>

      <p class="shop-prompt">You can shop in:</p>

      <div class="category-links">
        <a href="category-earring.html" class="btn category-btn">Earrings</a>
        <a href="category-hair-jewelry.html" class="btn category-btn">Hair-Jewelery</a>
        <a href="category-necklace.html" class="btn category-btn">Necklace</a>
        <a href="category-bracelets-bangles.html" class="btn category-btn">Bracelets</a>
      </div>

      <a href="contact.html" class="btn help-btn">Help Us</a>

      <p class="note">&#10022; ASPIRANT · fine jewellery &#10022;</p>
    </div>
  </div>
</body>
</html>
